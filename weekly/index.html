<!doctype html>
<html lang="en" data-resolution="landscape" data-format="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>TaleX Weekly Buyback</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="data/week.js"></script>
    <script src="src/weekly.js"></script>
    <link rel="stylesheet" href="weekly.css" />
    <style>
      html, body { width: 1920px; height: 1080px; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Scene windows below must match audio/beats.json (scripts/weekly.mjs verifies them). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.1" data-width="1920" data-height="1080" data-fps="30">
      <div id="scene-bg" class="clip" data-composition-id="bg" data-composition-src="compositions/bg.html"
           data-start="0" data-duration="14.1" data-track-index="0" data-width="1920" data-height="1080"></div>
      <div id="scene-counter" class="clip" data-composition-id="counter" data-composition-src="compositions/counter.html"
           data-start="0" data-duration="2.424" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="scene-receipt" class="clip" data-composition-id="receipt" data-composition-src="compositions/receipt.html"
           data-start="2.424" data-duration="2.626" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="scene-holders" class="clip" data-composition-id="holders" data-composition-src="compositions/holders.html"
           data-start="5.05" data-duration="5.6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="scene-finale" class="clip" data-composition-id="finale" data-composition-src="compositions/finale.html"
           data-start="10.65" data-duration="3.45" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- the one and only soundtrack; its transients drive the whole schedule (audio/beats.json) -->
      <audio id="music" src="audio/music.mp3" data-start="0" data-duration="14.1" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      // The root owns no motion of its own: every scene is a sub-composition
      // with its own timeline, which the runtime nests automatically.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
