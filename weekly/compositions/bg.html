<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>bg — animated background</title></head>
  <body>
    <template>
      <link rel="stylesheet" href="weekly.css" />
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #0d1417 0%, #0a0e10 60%, #070a0b 100%); }
        #bg-grid {
          position: absolute; left: -20%; top: -20%; width: 140%; height: 140%;
          background-image:
            linear-gradient(to right, rgba(110, 239, 0, 0.09) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(110, 239, 0, 0.09) 1px, transparent 1px);
          background-size: 88px 88px;
          -webkit-mask-image: radial-gradient(70% 60% at 50% 50%, #000 20%, transparent 100%);
          mask-image: radial-gradient(70% 60% at 50% 50%, #000 20%, transparent 100%);
        }
        .bg-blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(90px); will-change: transform; }
        #bg-blob-a { left: -260px; top: -300px; background: radial-gradient(circle, rgba(110, 239, 0, 0.16) 0%, rgba(110, 239, 0, 0) 65%); }
        #bg-blob-b { right: -320px; bottom: -340px; background: radial-gradient(circle, rgba(110, 239, 0, 0.11) 0%, rgba(110, 239, 0, 0) 65%); }
        #bg-sweep {
          position: absolute; top: -40%; left: 0; width: 34%; height: 180%;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(150, 255, 60, 0.035) 50%, rgba(255, 255, 255, 0) 100%);
        }
        #bg-vignette { position: absolute; inset: 0; background: radial-gradient(90% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }
      </style>
      <div id="root" data-composition-id="bg" data-width="1920" data-height="1080">
        <div id="bg-grid" data-layout-allow-overflow></div>
        <div id="bg-blob-a" class="bg-blob" data-layout-allow-overflow></div>
        <div id="bg-blob-b" class="bg-blob" data-layout-allow-overflow></div>
        <div id="bg-sweep" data-layout-allow-overflow></div>
        <div id="bg-vignette"></div>
      </div>
      <script>
        (function () {
          var D = window.Weekly.schedule.duration; // 12
          var tl = gsap.timeline({ paused: true });
          // grid drifts one cell diagonally over the whole video (seamless period)
          tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: -88, y: -88, duration: D, ease: "none" }, 0);
          // two glow blobs breathe and drift slowly (finite yoyo repeats)
          tl.fromTo("#bg-blob-a", { x: 0, y: 0, scale: 1 }, { x: 120, y: 80, scale: 1.18, duration: 4, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(D / 4) - 1) }, 0);
          tl.fromTo("#bg-blob-b", { x: 0, y: 0, scale: 1.1 }, { x: -140, y: -60, scale: 0.95, duration: 3, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(D / 3) - 1) }, 0);
          // a soft light band sweeps across the frame, three passes
          tl.fromTo("#bg-sweep", { xPercent: -140, rotation: 12 }, { xPercent: 440, rotation: 12, duration: 4, ease: "sine.inOut", repeat: Math.max(0, Math.floor(D / 4) - 1) }, 0);
          window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
