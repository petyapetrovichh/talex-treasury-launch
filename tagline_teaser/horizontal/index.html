<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>TaleX tagline teaser — horizontal</title>
    <link rel="preload" href="assets/fonts/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="teaser.css" />
    <style>
      html,
      body,
      #root {
        width: 1920px;
        height: 1080px;
      }
    </style>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="timeline.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-layout="horizontal"
      data-safe-margin="88"
      data-start="0"
      data-duration="8.033333"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="text-scene" class="scene">
        <div id="text"></div>
      </div>
      <div id="logo-scene" class="scene">
        <img id="logo" src="assets/talex-logo-hd.png" alt="TaleX" />
      </div>
      <div id="measure" aria-hidden="true"></div>
      <audio
        id="sfx"
        src="assets/audio/tagline_sfx.wav"
        data-start="0"
        data-duration="8.033333"
        data-track-index="0"
        data-volume="1"
      ></audio>
    </div>
    <script src="teaser.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.buildTeaser(gsap.timeline({ paused: true }));
      window.__timelines["main"].seek(0);
    </script>
  </body>
</html>
